# ═══════════════════════════════════════════════════════
#  Stardom Textiles — netlify.toml
# ═══════════════════════════════════════════════════════
#
#  Place this file in the ROOT of your project.
#  NO redirect rules for /admin — Netlify serves real
#  files (admin/index.html) directly without rules.
#  Redirect rules caused ERR_TOO_MANY_REDIRECTS.
#
# ═══════════════════════════════════════════════════════

[build]
  publish = "public"
  # No build command needed for a plain HTML site.

# ───────────────────────────────────────────────────────
#  HEADERS only — no redirects (they caused a loop)
# ───────────────────────────────────────────────────────

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"