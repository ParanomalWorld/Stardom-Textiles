backend:
  name: git-gateway
  branch: master   # or main, whichever is your default

media_folder: "images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Hero Section"
        name: "hero"
        file: "data/hero.json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Subheading", name: "subheading", widget: "text" }
          - { label: "Hero Image", name: "image", widget: "image" }

  - name: "solutions"
    label: "Solutions"
    files:
      - label: "Solutions List"
        name: "solutions"
        file: "data/solutions.json"
        fields:
          - label: "Solutions"
            name: "solutions"
            widget: "list"
            fields:
              - { label: "Badge", name: "badge", widget: "select", options: ["B2B", "B2C", "B2C/B2B"] }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Button Text", name: "buttonText", widget: "string", default: "Learn more" }
              - { label: "Button Link", name: "buttonLink", widget: "string", default: "#" }

  - name: "products"
    label: "Products"
    files:
      - label: "Products List"
        name: "products"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Button Text", name: "buttonText", widget: "string", default: "Enquire" }
              - label: "Categories (for filtering)"
                name: "categories"
                widget: "select"
                options: ["b2b", "b2c", "best"]
                multiple: true
                required: false